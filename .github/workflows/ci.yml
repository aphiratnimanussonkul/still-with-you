name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: pnpm --filter @still-with-you/contracts build

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build web
        run: pnpm --filter @still-with-you/web build
        env:
          VITE_API_URL: http://localhost:3000
          VITE_SUPABASE_URL: https://hazkqphgdkklsvkrhubg.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_TODq1gSkK5bu8InyIJRtVQ_vB7u8zsZ
          VITE_USE_MSW: 'false'

  build-web-msw:
    name: Build web (MSW / Pages)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production MSW build
        run: pnpm --filter "./packages/*" build && pnpm --filter @still-with-you/web build
        env:
          VITE_API_URL: http://localhost:3000
          VITE_SUPABASE_URL: https://hazkqphgdkklsvkrhubg.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_TODq1gSkK5bu8InyIJRtVQ_vB7u8zsZ
          VITE_USE_MSW: 'true'

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: supabase/postgres:15.1.0.117
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: pnpm --filter @still-with-you/contracts build

      - name: Create swy_test database
        env:
          PGPASSWORD: postgres
        run: |
          # supabase/postgres initializes cluster objects on the default
          # `postgres` database; creating swy_test keeps tests off that DB.
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE swy_test;"

      - name: Run migrations
        run: |
          cd supabase/migrations
          for f in *.sql; do
            PGPASSWORD=postgres psql -h localhost -U postgres -d swy_test -f "$f"
          done
        env:
          PGPASSWORD: postgres

      - name: Run tests
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/swy_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/swy_test
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: test-key
          SUPABASE_ANON_KEY: test-anon-key
          WEB_ORIGIN: https://stillwithyou.nimanussonkul.work,https://still-with-you-5b1.pages.dev,http://localhost:5173

  docker-smoke:
    name: Docker smoke (api + worker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: swy-api:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/worker/Dockerfile
          load: true
          tags: swy-worker:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Node 22, supabase-js import, worker start, API /health
        run: |
          set -euo pipefail

          docker run --rm swy-worker:smoke node -e "
            import { createClient } from '@supabase/supabase-js';
            console.log('node', process.version);
            if (!process.version.startsWith('v22.')) {
              throw new Error('expected Node 22, got ' + process.version);
            }
            const client = createClient('https://example.supabase.co', 'test-service-role', {
              auth: { persistSession: false, autoRefreshToken: false },
            });
            console.log('supabase-js import ok', typeof client.from);
          "

          docker rm -f swy-worker-smoke swy-api-smoke >/dev/null 2>&1 || true
          docker run -d --name swy-worker-smoke \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:1/postgres \
            -e SUPABASE_URL=https://example.supabase.co \
            -e SUPABASE_SERVICE_ROLE_KEY=test-service-role \
            swy-worker:smoke
          trap 'docker logs swy-worker-smoke || true; docker logs swy-api-smoke || true; docker rm -f swy-worker-smoke swy-api-smoke || true' EXIT
          started=0
          for i in $(seq 1 15); do
            docker logs swy-worker-smoke > /tmp/worker.log 2>&1 || true
            if grep -q 'Worker started' /tmp/worker.log; then
              started=1
              break
            fi
            if grep -q 'native WebSocket not found' /tmp/worker.log; then
              echo 'worker still crashing on supabase-js WebSocket'
              cat /tmp/worker.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/worker.log
          test "$started" = 1
          docker inspect -f '{{.State.Running}}' swy-worker-smoke | grep -qx true
          echo 'worker stayed up on node:22-alpine'

          docker run -d --name swy-api-smoke \
            -p 3000:3000 \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:1/postgres \
            -e SUPABASE_URL=https://example.supabase.co \
            -e SUPABASE_SERVICE_ROLE_KEY=test-service-role \
            -e SUPABASE_ANON_KEY=test-anon \
            -e WEB_ORIGIN=http://localhost:5173 \
            swy-api:smoke
          ok=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/health; then
              ok=1
              break
            fi
            sleep 1
          done
          test "$ok" = 1
          curl -sf http://127.0.0.1:3000/health | tee /tmp/health.json
          grep -Eq '"status": ?"ok"' /tmp/health.json
          docker exec swy-api-smoke node -p 'process.version'

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/cursor/'))

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Worker
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/worker
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
